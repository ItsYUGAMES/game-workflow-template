<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <title>守灯人关键画面</title>
  <rect width="760" height="430" fill="#0E1A2B"/>
  <ellipse cx="380" cy="255" rx="330" ry="150" fill="#24364A"/>

  <!-- HUD -->
  <circle cx="26" cy="27" r="7" fill="#FFB347"/>
  <text x="40" y="32" fill="#FFFFFF" font-size="14">3/3 盏亮着</text>
  <rect x="290" y="18" width="180" height="10" rx="5" fill="#24364A"/>
  <rect x="290" y="18" width="70" height="10" rx="5" fill="#FFB347"/>
  <circle cx="360" cy="23" r="7" fill="#FFD27A"/>
  <text x="380" y="48" fill="#FFFFFF" font-size="13" text-anchor="middle">还有 112 秒天亮</text>
  <text x="735" y="32" fill="#FFFFFF" font-size="14" text-anchor="end">第 1/3 夜</text>

  <!-- 灯 A：燃料低，闪烁 -->
  <circle cx="190" cy="240" r="24" fill="none" stroke="#FF6B3D" stroke-width="2" stroke-dasharray="3 5"/>
  <circle cx="190" cy="240" r="9" fill="#FF6B3D"/>

  <!-- 灯 B：亮，飞蛾停着 -->
  <circle cx="560" cy="230" r="26" fill="#FFB347" opacity="0.18"/>
  <circle cx="560" cy="230" r="9" fill="#FFB347"/>
  <circle cx="560" cy="204" r="12" fill="none" stroke="#3A4E66" stroke-width="3"/>
  <path d="M560 192 A12 12 0 1 1 549.6 210" fill="none" stroke="#D9D4C7" stroke-width="3"/>
  <path d="M560 204 m-7 0 q3 -6 7 0 q4 -6 7 0 q-3 6 -7 0 q-4 6 -7 0" fill="#D9D4C7"/>

  <!-- 挥灯扇形 -->
  <path d="M470 250 L505.8 146 A110 110 0 0 1 574 285.8 Z" fill="#FFB347" fill-opacity="0.13" stroke="#FFB347" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- 守灯人 -->
  <circle cx="470" cy="250" r="9" fill="#FFFFFF"/>
  <circle cx="481" cy="244" r="4" fill="#FFB347"/>

  <!-- 新飞来的飞蛾 -->
  <path d="M690 118 Q640 150 578 196" fill="none" stroke="#D9D4C7" stroke-width="1.5" stroke-dasharray="2 5"/>
  <path d="M690 118 m-7 0 q3 -6 7 0 q4 -6 7 0 q-3 6 -7 0 q-4 6 -7 0" fill="#D9D4C7"/>

  <!-- 画面外告急的灯 -->
  <polygon points="12,330 32,316 32,344" fill="#FF6B3D"/>

  <!-- 标注 -->
  <g font-size="12" fill="#FFFFFF">
    <text x="442" y="284" text-anchor="end">守灯人（玩家）</text>
    <text x="484" y="134">挥灯：扇形里的飞蛾被赶走</text>
    <text x="620" y="230">飞蛾停在灯上</text>
    <text x="620" y="246">停满 3 秒，灯熄</text>
    <text x="204" y="289">燃料低：灯闪烁</text>
    <text x="64" y="334">画面外告急的灯</text>
    <text x="504" y="27">天亮倒计时</text>
    <text x="740" y="172" text-anchor="end">新飞蛾飞向</text>
    <text x="740" y="188" text-anchor="end">燃料最多的灯</text>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <circle cx="455" cy="280" r="10" fill="#FFFFFF"/><text x="455" y="284" fill="#0E1A2B">1</text>
    <circle cx="470" cy="130" r="10" fill="#FFFFFF"/><text x="470" y="134" fill="#0E1A2B">2</text>
    <circle cx="606" cy="232" r="10" fill="#FFFFFF"/><text x="606" y="236" fill="#0E1A2B">3</text>
    <circle cx="190" cy="285" r="10" fill="#FFFFFF"/><text x="190" y="289" fill="#0E1A2B">4</text>
    <circle cx="50" cy="330" r="10" fill="#FFFFFF"/><text x="50" y="334" fill="#0E1A2B">5</text>
    <circle cx="490" cy="23" r="10" fill="#FFFFFF"/><text x="490" y="27" fill="#0E1A2B">6</text>
    <circle cx="718" cy="150" r="10" fill="#FFFFFF"/><text x="718" y="154" fill="#0E1A2B">7</text>
  </g>
</svg>
