<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <title>续火反馈示意图</title>
  <rect width="560" height="240" fill="#0E1A2B"/>

  <!-- 1 燃料低：闪烁 -->
  <circle cx="90" cy="110" r="10" fill="#FF6B3D"/>
  <circle cx="90" cy="110" r="24" fill="none" stroke="#FF6B3D" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="90" y="160" fill="#FFFFFF" font-size="13" text-anchor="middle">燃料低：闪烁</text>
  <text x="90" y="178" fill="#9FB0C4" font-size="11" text-anchor="middle">越快熄灭闪得越快</text>

  <!-- 2 续火进度圆环 -->
  <circle cx="240" cy="110" r="10" fill="#FFB347"/>
  <circle cx="240" cy="110" r="28" fill="none" stroke="#24364A" stroke-width="6"/>
  <path d="M240 82 A28 28 0 1 1 215.75 124" fill="none" stroke="#FFB347" stroke-width="6" stroke-linecap="round"/>
  <text x="240" y="160" fill="#FFFFFF" font-size="13" text-anchor="middle">续火进度圆环</text>
  <text x="240" y="178" fill="#9FB0C4" font-size="11" text-anchor="middle">按住增长，松开回落</text>

  <!-- 4 飞蛾停留 -->
  <circle cx="390" cy="110" r="10" fill="#FFB347"/>
  <circle cx="390" cy="72" r="12" fill="none" stroke="#D9D4C7" stroke-width="2"/>
  <path d="M390 72 m-7 0 q3 -6 7 0 q4 -6 7 0 q-3 6 -7 0 q-4 6 -7 0" fill="#D9D4C7"/>
  <text x="390" y="160" fill="#FFFFFF" font-size="13" text-anchor="middle">飞蛾停留</text>
  <text x="390" y="178" fill="#9FB0C4" font-size="11" text-anchor="middle">外圈表示停留进度</text>

  <!-- 3 告急箭头（屏幕右边缘） -->
  <line x1="540" y1="20" x2="540" y2="220" stroke="#9FB0C4" stroke-width="1" stroke-dasharray="4 4"/>
  <polygon points="548,110 528,96 528,124" fill="#FF6B3D"/>
  <text x="520" y="160" fill="#FFFFFF" font-size="13" text-anchor="end">告急箭头</text>
  <text x="520" y="178" fill="#9FB0C4" font-size="11" text-anchor="end">指向画面外的灯</text>

  <!-- 编号 -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <circle cx="126" cy="80" r="10" fill="#FFFFFF"/><text x="126" y="84" fill="#0E1A2B">1</text>
    <circle cx="282" cy="80" r="10" fill="#FFFFFF"/><text x="282" y="84" fill="#0E1A2B">2</text>
    <circle cx="505" cy="96" r="10" fill="#FFFFFF"/><text x="505" y="100" fill="#0E1A2B">3</text>
    <circle cx="420" cy="62" r="10" fill="#FFFFFF"/><text x="420" y="66" fill="#0E1A2B">4</text>
  </g>
</svg>
